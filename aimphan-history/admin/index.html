<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>หลังบ้าน · รุ่งอรุณสุโขทัย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#060914; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07); --line:rgba(160,190,255,.14);
  --ink:#E8EEFF; --muted:#8C9AC0; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6; --lime:#A3E635; --amber:#FBBF24; --red:#FB7185;
  --grad:linear-gradient(120deg,#22D3EE,#8B5CF6 60%,#F472B6);
  --f-ui:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --f-num:'Space Grotesk','IBM Plex Sans Thai',system-ui,sans-serif;
  --side:248px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);
  background-image:radial-gradient(900px 520px at 85% -8%,rgba(139,92,246,.28),transparent 60%),radial-gradient(760px 460px at -5% 8%,rgba(34,211,238,.18),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(244,114,182,.12),transparent 60%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(140,170,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(140,170,255,.045) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(ellipse at 50% 20%,#000 30%,transparent 80%)}
a{color:var(--cyan);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-num),var(--f-ui);margin:0;letter-spacing:.01em}
.hidden{display:none!important}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:rgba(6,9,20,.6);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font:600 17px var(--f-num)}
.brand i{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 24px rgba(139,92,246,.55);font-style:normal;color:#04101c;font-weight:700}
.brand small{display:block;color:var(--muted);font:400 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:500;transition:.18s}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{color:var(--ink);background:var(--panel)}
.nav a[aria-current=page]{color:#fff;background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(139,92,246,.14));box-shadow:inset 0 0 0 1px rgba(34,211,238,.35),0 0 22px rgba(34,211,238,.1)}
.side .sp{flex:1}
.side .foot{font-size:12px;color:var(--muted);padding:8px 10px}
.main{padding:28px clamp(16px,3vw,40px) 96px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top h1{font-size:clamp(24px,3vw,32px);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top p{margin:4px 0 0;color:var(--muted)}

/* ---------- primitives ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.28)}
.card h3{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.mt{margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:500;transition:.18s;white-space:nowrap}
.btn:hover{border-color:rgba(34,211,238,.55);box-shadow:0 0 18px rgba(34,211,238,.18)}
.btn.pri{border:0;color:#050a18;font-weight:600;background:var(--grad);box-shadow:0 6px 26px rgba(139,92,246,.4)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 8px 32px rgba(34,211,238,.45)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:10px}
.btn.danger:hover{border-color:var(--red);box-shadow:0 0 18px rgba(251,113,133,.25)}
.btn.danger.armed{background:rgba(251,113,133,.18);border-color:var(--red);color:#ffd2da}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.chips button{border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:10px;cursor:pointer;font-weight:500}
.chips button[aria-pressed=true]{background:var(--grad);color:#050a18;font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.3)}
.badge.warn{background:rgba(251,191,36,.12);color:var(--amber);border-color:rgba(251,191,36,.35)}
.muted{color:var(--muted)}
.sm{font-size:13px}

/* ---------- forms ---------- */
.fld{display:block}
.fld>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.fld input,.fld select,.fld textarea,.login input{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(5,8,20,.65);padding:10px 12px;min-height:42px;outline:0;transition:.18s}
.fld textarea{resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus,.login input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.fld .hint{font-size:12px;color:var(--muted);margin-top:4px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .wide{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}

/* ---------- KPI ---------- */
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--c,var(--cyan));opacity:.16;filter:blur(20px)}
.kpi .lb{color:var(--muted);font-size:13px}
.kpi .v{font:600 clamp(28px,3.2vw,40px)/1.1 var(--f-num);margin:6px 0 10px;text-shadow:0 0 24px var(--c,var(--cyan))}
.kpi .sub{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.kpi .sub b{color:var(--ink);font-family:var(--f-num);font-weight:600}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font:11px var(--f-num)}
.chart .gl{stroke:rgba(160,190,255,.1);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.readout{min-height:24px;font:13px var(--f-num);color:var(--ink);display:flex;gap:16px;flex-wrap:wrap}
.bars .row{display:grid;grid-template-columns:minmax(80px,28%) 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bars .row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);box-shadow:0 0 12px rgba(34,211,238,.5)}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut-wrap svg{width:132px;height:132px;flex:none}
.hours{display:flex;align-items:flex-end;gap:3px;height:96px}
.hours i{flex:1;border-radius:4px 4px 1px 1px;background:linear-gradient(180deg,var(--violet),rgba(34,211,238,.6));min-height:2px;opacity:.9}
.hours-ax{display:flex;justify-content:space-between;font:11px var(--f-num);color:var(--muted);margin-top:6px}
.feed{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.feed li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.feed .dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.feed time{margin-left:auto;color:var(--muted);font:12px var(--f-num);white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* ---------- lists / rows ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.rowi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}
.rowi.off{opacity:.55}
.rowi .y{font:600 13px var(--f-num);color:var(--cyan);min-width:88px}
.rowi .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{display:block;color:inherit;transition:.2s}
.pcard:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.5);box-shadow:0 16px 44px rgba(34,211,238,.14)}
.pcard h2{font-size:20px;margin-bottom:4px}
.pcard .n{font:600 34px var(--f-num);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub-rows{display:grid;grid-template-columns:70px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.sub-rows.src{grid-template-columns:1fr 1.4fr auto}
.sub-rows input{width:100%;border:1px solid var(--line);border-radius:10px;background:rgba(5,8,20,.65);padding:8px 10px;min-height:38px}
.sub-rows input:focus{outline:0;border-color:var(--cyan)}
.preview{max-width:100%;max-height:180px;border-radius:12px;border:1px solid var(--line);margin-top:8px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--cyan)}

/* ---------- sticky save bar & status (inline, not a popup) ---------- */
.savebar{position:fixed;left:calc(var(--side) + 16px);right:16px;bottom:14px;z-index:20;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:16px;
  background:rgba(10,14,32,.82);backdrop-filter:blur(16px);border:1px solid rgba(251,191,36,.4);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(251,191,36,.1)}
.savebar.ok{border-color:rgba(163,230,53,.45);box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(163,230,53,.12)}
.savebar.err{border-color:rgba(251,113,133,.55)}
.status{min-height:22px;font-size:14px}
.status.err{color:var(--red)} .status.ok{color:var(--lime)}

/* ---------- login ---------- */
.login-wrap{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:min(420px,100%);padding:32px}
.login h1{font-size:26px;margin:14px 0 4px}
.login p{color:var(--muted);margin:0 0 20px}
.login .orb{width:56px;height:56px;border-radius:18px;background:var(--grad);box-shadow:0 0 40px rgba(139,92,246,.7);display:grid;place-items:center;font:700 24px var(--f-num);color:#050a18}
.login label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.login .btn{width:100%;margin-top:16px}
.login .status{margin-top:12px}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);z-index:30}
  .brand{padding:0 8px 0 0}.brand small,.side .foot,.side .sp{display:none}
  .nav{display:flex;gap:4px}.nav a{padding:8px 11px;white-space:nowrap}
  .savebar{left:12px;right:12px;flex-wrap:wrap}
}
@media (max-width:620px){.g4,.g2,.g3,.form{grid-template-columns:1fr}.rowi{grid-template-columns:1fr}.rowi .b{justify-content:flex-start}.sub-rows{grid-template-columns:60px 1fr}.sub-rows.src{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* Illustration kit: every scene is composed from these SVG parts.
   Exposes window.TH_ART = { artSVG, ARTS, HERO_SCENES, PR } */
(function(){
'use strict';
/* ---------- illustration kit: every scene is composed from these parts ---------- */
function G(o,inner){
  var sx=o.f?-o.s:o.s;
  return '<g transform="translate('+o.x+' '+o.y+') scale('+sx+' '+o.s+')">'+inner+'</g>';
}
function prangBody(){
  return '<path class="dk" d="M-72 0V-26H-58V-54H-46V-82H-34V-112Q-22-150 0-206Q22-150 34-112V-82H46V-54H58V-26H72V0Z"/>'+
    '<path class="gd" d="M-58-26H58M-46-54H46M-34-82H34M-26-112H26"/>'+
    '<path class="gd" d="M-14-150Q0-176 14-150"/>'+
    '<rect class="dk" x="-1.5" y="-228" width="3" height="24"/><circle class="gf" cx="0" cy="-230" r="3.5"/>';
}
var PR={
  sun:function(o){return G(o,'<circle class="s-glow" r="64"/><circle class="s-sun" r="38"/>')},
  moon:function(o){return G(o,'<circle r="50" fill="var(--sun-glow)"/><circle r="26" fill="var(--art-moon)"/><circle cx="-8" cy="-6" r="5" fill="var(--art-dk)" opacity=".12"/><circle cx="9" cy="8" r="7" fill="var(--art-dk)" opacity=".1"/>')},
  glow:function(o){return G(o,'<circle class="s-glow" r="90"/>')},
  cloud:function(o){
    var c=o.k==='smoke'?'smoke':'cloud';
    return G(o,'<g class="'+c+'"><ellipse cx="0" cy="0" rx="46" ry="12"/><ellipse cx="30" cy="-9" rx="30" ry="12"/><ellipse cx="-24" cy="-7" rx="26" ry="10"/></g>');
  },
  stars:function(){
    var s='';
    for(var i=0;i<30;i++){
      var x=(i*137+23)%590+5,y=(i*71+11)%170+8,r=0.8+(i%3)*0.5;
      s+='<circle class="twk" style="animation-delay:-'+(i%6)+'s" cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#FFF6DA"/>';
    }
    return s;
  },
  hills:function(){
    return '<path fill="var(--art-hill2)" d="M0 262V196Q50 160 110 186T240 172T380 192T500 168T600 190V262Z"/>'+
      '<path fill="var(--art-hill1)" d="M0 262V222Q90 196 180 222T360 214T520 224T600 212V262Z"/>';
  },
  ground:function(){
    return '<path fill="var(--ground)" d="M0 262Q150 246 300 258T600 252T1000 256V340H0Z"/>'+
      '<path fill="var(--art-ground2)" opacity=".5" d="M0 300Q150 286 300 298T600 292V340H0Z"/>';
  },
  ledge:function(){
    return '<rect y="296" width="600" height="44" fill="var(--art-ledge)"/><rect y="296" width="600" height="5" fill="var(--art-ledge2)"/>';
  },
  water:function(o){
    var y=o.y||262,r='<rect x="0" y="'+y+'" width="1000" height="'+(340-y)+'" fill="var(--art-water)"/>';
    for(var row=0;row<3;row++){
      var yy=y+16+row*22;
      if(yy>332)break;
      var d='M-40 '+yy+' q15 -7 30 0';
      for(var i=0;i<42;i++)d+=' t30 0';
      r+='<path class="wave" style="animation-duration:'+(5+row*2)+'s" d="'+d+'" fill="none" stroke="var(--art-wave)" stroke-width="2" stroke-dasharray="44 26"/>';
    }
    return r;
  },
  text:function(o){
    return '<text class="gl" x="'+o.x+'" y="'+o.y+'" font-size="'+(o.s*44)+'" text-anchor="middle" fill="'+(o.c||'var(--art-ink)')+'" opacity="'+(o.a||.8)+'">'+o.t+'</text>';
  },

  /* buildings */
  chedi:function(o){
    return G(o,'<g class="dk"><rect x="-96" y="-24" width="192" height="24" rx="2"/><rect x="-78" y="-44" width="156" height="20" rx="2"/><rect x="-60" y="-61" width="120" height="17" rx="2"/><rect x="-38" y="-89" width="76" height="28"/>'+
      '<path d="M0-188C19-165 37-134 37-100V-87H-37V-100C-37-134-19-165 0-188Z"/><rect x="-1.5" y="-218" width="3" height="34"/></g>'+
      '<circle class="gf" cx="0" cy="-220" r="4"/><path class="gd" d="M-30-100Q0-120 30-100M-24-122Q0-138 24-122M-60-61H60M-78-44H78"/>');
  },
  bellstupa:function(o){
    return G(o,'<g class="dk"><rect x="-72" y="-18" width="144" height="18"/><rect x="-58" y="-34" width="116" height="16"/>'+
      '<path d="M-40-34C-50-80-24-118 0-128C24-118 50-80 40-34Z"/><rect x="-13" y="-144" width="26" height="16"/><path d="M0-250L-8-144H8Z"/></g>'+
      '<path class="gd" d="M-72-18H72M-58-34H58M-30-86Q0-70 30-86M-4-170H4M-5-190H5M-5-210H5M-3-230H3"/><circle class="gf" cx="0" cy="-252" r="3.5"/>');
  },
  prang:function(o){
    var r=prangBody();
    if(o.k==='arun'){
      r+='<g transform="translate(-106 0) scale(.42)">'+prangBody()+'</g><g transform="translate(106 0) scale(.42)">'+prangBody()+'</g>';
    }
    return G(o,r);
  },
  hall:function(o){
    return G(o,'<g class="dk"><rect x="-98" y="-14" width="196" height="14"/><rect x="-80" y="-58" width="160" height="44"/><path d="M-104-58L-72-96H72L104-58Z"/><path d="M-88-96L-58-130H58L88-96Z"/>'+
      '<path d="M-58-130Q-70-138-64-150L-52-130ZM58-130Q70-138 64-150L52-130Z"/></g>'+
      '<path class="gd" d="M-104-58L-72-96H72L104-58M-88-96L-58-130H58L88-96"/>'+
      '<path d="M-60-14V-58M-30-14V-58M0-14V-58M30-14V-58M60-14V-58" stroke="var(--gild)" stroke-width="3" opacity=".7"/>');
  },
  prasat:function(o){
    var t='';
    for(var i=0;i<3;i++){
      var y0=-14-i*40,w=92-i*16,w2=64-i*12;
      t+='<path class="dk" d="M'+(-w)+' '+y0+'L'+(-w2)+' '+(y0-34)+'H'+w2+'L'+w+' '+y0+'Z"/><path class="gd" d="M'+(-w)+' '+y0+'L'+(-w2)+' '+(y0-34)+'H'+w2+'L'+w+' '+y0+'"/>';
    }
    return G(o,'<rect class="dk" x="-90" y="-14" width="180" height="14"/><rect class="dk" x="-60" y="-34" width="120" height="20"/>'+t+
      '<path class="dk" d="M0-196L-7-136H7Z"/><circle class="gf" cx="0" cy="-198" r="3.5"/>');
  },
  dome:function(o){
    var w='';
    for(var i=0;i<9;i++)w+='<rect x="'+(-112+i*28)+'" y="-46" width="8" height="18" rx="4" fill="var(--sun)" opacity=".65"/>';
    return G(o,'<g class="dk"><rect x="-130" y="-56" width="260" height="56"/><rect x="-40" y="-100" width="80" height="44"/>'+
      '<path d="M-44-100C-44-148-20-164 0-170C20-164 44-148 44-100Z"/><path d="M-110-56C-110-80-92-92-80-96C-68-92-50-80-50-56Z"/>'+
      '<path d="M110-56C110-80 92-92 80-96C68-92 50-80 50-56Z"/><rect x="-2" y="-196" width="4" height="30"/></g>'+
      '<path class="gd" d="M-124-52H124M-130-6H130"/>'+w);
  },
  fort:function(o){
